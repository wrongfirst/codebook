name: Sync Template Updates

on:
  workflow_dispatch:
  repository_dispatch:
    types: [template_updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Do not run on the primary template repository itself
    if: github.repository != 'wrongfirst/codebook'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Template
        run: |
          git remote add upstream https://github.com/wrongfirst/codebook.git || git remote set-url upstream https://github.com/wrongfirst/codebook.git
          git fetch upstream template

      - name: Check for New Upstream Commits
        id: check_commits
        run: |
          UPSTREAM_REV=$(git rev-parse upstream/template)
          BASE_REV=$(git merge-base HEAD upstream/template)
          if [ "$UPSTREAM_REV" = "$BASE_REV" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new updates from template."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "New updates found in template."
          fi

      - name: Attempt Automatic Merge
        if: steps.check_commits.outputs.has_updates == 'true'
        id: merge_attempt
        run: |
          # Attempt clean merge from upstream template
          if git merge upstream/template --no-commit --no-ff -m "sync updates from upstream template"; then
            echo "merge_conflict=false" >> $GITHUB_OUTPUT
            git commit -m "sync updates from upstream template"
          else
            echo "merge_conflict=true" >> $GITHUB_OUTPUT
            git merge --abort || true
          fi

      - name: Push Clean Merge to Target Branch
        if: steps.check_commits.outputs.has_updates == 'true' && steps.merge_attempt.outputs.merge_conflict == 'false'
        run: |
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Pull Request on Conflict
        if: steps.check_commits.outputs.has_updates == 'true' && steps.merge_attempt.outputs.merge_conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="sync/template-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          
          # Perform merge allowing conflict markers so they appear in the PR diff
          git merge upstream/template -m "(unresolved) sync updates from template" || true
          
          git add -A
          git commit -m "(unresolved) sync updates from template"
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --title "(unresolved) sync updates from template" \
            --body "Automated template sync detected merge conflicts between \`wrongfirst/codebook:template\` and this repository. Please review and resolve the conflicts in this PR." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME"
