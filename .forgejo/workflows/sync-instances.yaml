name: Sync Template to Instances

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository slug (e.g. wrongfirst/warmup or "all")'
        required: true
        default: 'all'
      dry_run:
        description: 'Simulate sync without pushing changes'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: nautilus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Pipeline
        env:
          FORGEJO_TOKEN: ${{ secrets.CODEBOOK_SYNC_INSTANCES }}
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          npm run sync:instances -- \
            --repo "${{ inputs.target_repo }}" \
            $DRY_RUN_ARG
