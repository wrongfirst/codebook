name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        required: true
        default: "production"
        options:
          - "production"
          - "staging"

jobs:
  deploy:
    runs-on: nautilus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ ((github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && 'staging' || 'production' }}
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            export VITE_ENABLE_CLOUD=true
          fi
          pnpm run deploy

      - name: Deploy Staging API Worker
        if: github.repository == 'wrongfirst/codebook' && ((github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run check:server
          pnpm run db:migrate:staging
          pnpm exec wrangler deploy -c wrangler.api.jsonc --env staging
          WORKER_NAME=wrongfirst-api-staging pnpm run prune:deployments || echo "[deploy] Warning: Pruning failed for wrongfirst-api-staging"
